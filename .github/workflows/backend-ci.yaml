name: Backend CI
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_notes_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d study_notes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.9"

      - name: Install UV
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.5"
      
      - name: Install dependencies
        run: uv sync --locked --no-install-project

      - name: Enable pgvector
        run: |
          docker exec ${{ job.services.postgres.id }} \
            psql -U postgres -d study_notes_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        env: 
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/study_notes_test
        run: uv run alembic upgrade head

      - name: Run pytest
        run: uv run pytest

