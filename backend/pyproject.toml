[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.11.8"
dependencies = [
    "alembic==1.18.1",
    "argon2-cffi==25.1.0",
    "asyncpg==0.31.0",
    "fastapi==0.124.4",
    "jieba==0.42.1",
    "modal>=1.5.5",
    "ollama==0.6.2",
    "passlib==1.7.4",
    "pgvector==0.5.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "python-jose==3.5.0",
    "python-slugify==8.0.4",
    "rank-bm25==0.2.2",
    "sentence-transformers==5.7.0",
    "sqlalchemy==2.0.45",
    "transformers==5.15.0",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
